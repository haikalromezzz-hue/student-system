<h1>Daftar Akaun</h1>

<form id="registerForm">

  <input
    type="text"
    id="name"
    placeholder="Nama"
    required
  >

  <input
    type="text"
    id="username"
    placeholder="Username"
  >

  <input
    type="email"
    id="email"
    placeholder="Email"
    required
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    required
  >

  <button type="submit">Daftar</button>

</form>

<div id="result"></div>

<script type="module" src="js/register.js"></script>
